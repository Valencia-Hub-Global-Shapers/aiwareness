name: Validate hub configs

on:
  pull_request:
    paths:
      - "locales/**"
      - "content/manifest.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar config.json de cada hub
        run: node scripts/validate-configs.js
