name: Keep Supabase awake

# Free-tier Supabase projects auto-pause after 7 days with no traffic.
# This pings the REST API daily so the project never goes idle long enough
# to trigger that.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sf -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/hubs?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
